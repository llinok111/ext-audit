name: Deploy demo to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 先跑测试：演示页发布前必须证明代码本身是通的
      - name: Run tests
        run: node test/run-all.mjs

      # 从源码重建界面，确保发布物与仓库代码一致，而不是提交的陈旧产物
      - name: Build single-file UI
        run: node tools/build-web.mjs

      - name: Prepare site
        run: |
          mkdir -p _site
          cp web/dist/ext-audit.html _site/index.html
          # 单文件界面不依赖外部资源，无需处理 base 路径

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
